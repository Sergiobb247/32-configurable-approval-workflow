# Render blueprint - API host (Person D / Ops).
# Contract: docs/technical-spec.md section 11.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo.
# Then set CORS_ORIGINS to the real Vercel frontend URL and run the seed
# once against the deployed database:
#   cd backend && python seed.py        (with the deployed DATABASE_URL)
# Smoke test afterwards:  curl https://<api-host>/health

databases:
  - name: approval-workflow-db
    plan: free
    databaseName: approvals

services:
  - type: web
    name: approval-workflow-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Secret — Render prompts for it on first deploy (never committed).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENV
        value: production
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      # Secret — exact Vercel origin(s), comma separated. Never "*".
      - key: CORS_ORIGINS
        sync: false
